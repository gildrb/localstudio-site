    <noscript id="static-fallback"><main class="prerender-home"><h1>Intelligence should be owned</h1><p><strong>Local Studio by Sybil Solutions</strong> is a local-first macOS workstation for running, managing, and using self-hosted language-model backends. It connects to local or remote controllers and supports vLLM, SGLang, llama.cpp, and MLX behind one OpenAI-compatible surface.</p><p>Use one Workbench for models, providers, browser research, files, terminals, and coding agents while keeping infrastructure choices and data under your control. Local Studio is open source under Apache-2.0. Signed Apple Silicon builds are available from GitHub Releases.</p><p>KittyLitter is the native iOS and Android companion for Codex, Claude, OpenCode, Pi, and Droid. It continues the same sessions while work stays on your Mac or server. Codex Shim exposes bring-your-own-key models to Codex Desktop through a local Responses API bridge.</p><p><a href="/developers">Developer portal</a> · <a href="/openapi.json">OpenAPI specification</a> · <a href="/docs">Documentation</a> · <a href="/about">About</a> · <a href="/contact">Contact</a> · <a href="/privacy">Privacy</a> · <a href="/llms.txt">Agent instructions</a></p></main></noscript>
