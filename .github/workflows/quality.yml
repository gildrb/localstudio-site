name: Quality

on:
  pull_request:
  push:
    branches: ["main", "refactor/canonical-functional"]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: "0.3.1"
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: vp run validate
      - run: vp run context:bundle
      - run: vp build
      - run: vp run styles:check --dist
      - run: vp run bundle:check
      - run: vp run reproducible:check
      - run: vp exec playwright install --with-deps chromium
      - run: vp run test:e2e
      - run: vp run test:visual
